<!-- login.html - Page d'authentification Discord -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard RP · Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* --- Thème sombre élégant --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0d14;
      color: #f0f2f8;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 1.5rem;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(88, 101, 242, 0.15), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 45, 120, 0.10), transparent 50%),
        #0b0d14;
      pointer-events: none;
    }
    .card {
      position: relative;
      z-index: 1;
      max-width: 420px;
      width: 100%;
      background: rgba(20, 24, 38, 0.7);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(148, 163, 184, 0.08);
      border-radius: 24px;
      padding: 2.4rem 2rem 2rem;
      box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(148, 163, 184, 0.04);
      text-align: left;
    }
    .icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #5865F2, #4752C4);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 1.2rem;
      box-shadow: 0 8px 24px -6px rgba(88, 101, 242, 0.4);
    }
    h1 {
      font-family: 'Sora', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }
    .sub {
      color: #8892b0;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #5865F2, #4752C4);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 24px -8px rgba(88, 101, 242, 0.5);
      width: 100%;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px -8px rgba(88, 101, 242, 0.6);
    }
    .btn:active { transform: translateY(0); }
    .footer {
      margin-top: 1.5rem;
      font-size: 12px;
      color: #545c72;
      text-align: center;
    }
    .footer a {
      color: #8892b0;
      text-decoration: none;
    }
    .footer a:hover { color: #f0f2f8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚙️</div>
    <h1>Dashboard RP</h1>
    <p class="sub">
      Connecte-toi avec Discord pour accéder au panel d'administration complet du serveur.
    </p>
    <a href="/auth/discord" class="btn" id="discord-login-btn" onclick="return handleLoginClick(this)">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791..."/></svg>
  <span id="discord-login-label">Connexion avec Discord</span>
</a>
<script>
  function handleLoginClick(el) {
    if (el.dataset.clicked === '1') return false;
    el.dataset.clicked = '1';
    el.style.pointerEvents = 'none';
    el.style.opacity = '0.7';
    document.getElementById('discord-login-label').textContent = 'Connexion en cours...';
    return true;
  }
</script>
    <div class="footer">Panel de gestion · Sécurisé</div>
  </div>
</body>
</html>
